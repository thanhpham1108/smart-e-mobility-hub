"852.69" y="420.8441">Actual arrival recorded without rounding</text></g><g id="Completed"><rect fill="#E8F1FA" height="69.4648" rx="12.5" ry="12.5" style="stroke:#42566B;stroke-width:0.5;" width="320.3027" x="835.65" y="556.8024"/><line style="stroke:#42566B;stroke-width:0.5;" x1="835.65" x2="1155.9527" y1="583.2907" y2="583.2907"/><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.8623" x="958.8702" y="575.3376">Completed</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.4414" x="840.65" y="601.8259">Linked parking session is Closed</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="300.3027" x="840.65" y="618.3141">Actual departure recorded without rounding</text></g><g id="Cancelled"><rect fill="#E8F1FA" height="69.4648" rx="12.5" ry="12.5" style="stroke:#42566B;stroke-width:0.5;" width="361.6055" x="7" y="161.8724"/><line style="stroke:#42566B;stroke-width:0.5;" x1="7" x2="368.6055" y1="188.3607" y2="188.3607"/><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.7822" x="154.9116" y="180.4076">Cancelled</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.6055" x="12" y="206.8959">Parking and eligible dependent requests cancelled</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.0918" x="12" y="223.3841">Remaining allocations released once</text></g><g id="Expired"><rect fill="#E8F1FA" height="69.4648" rx="12.5" ry="12.5" style="stroke:#42566B;stroke-width:0.5;" width="409.3477" x="1616.13" y="161.8724"/><line style="stroke:#42566B;stroke-width:0.5;" x1="1616.13" x2="2025.4777" y1="188.3607" y2="188.3607"/><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3721" x="1795.1178" y="180.4076">Expired</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="307.6377" x="1621.13" y="206.8959">No-show; check-in and cancellation disabled</text><text fill="#172B4D" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="389.3477" x="1621.13" y="223.3841">Unused charging requests cancelled; holds released once</text></g><ellipse cx="768.8" cy="63.8024" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="995.8" cy="708.2624" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="995.8" cy="708.2624" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="42" data-uid="ent0003" id="entity_GMN2"><path d="M1044.53,51.7324 L1044.53,75.8652 L1401.0847,75.8652 L1401.0847,61.7324 L1391.0847,51.7324 L1044.53,51.7324" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><path d="M1391.0847,51.7324 L1391.0847,61.7324 L1401.0847,61.7324 L1391.0847,51.7324" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="335.5547" x="1050.53" y="68.334">Only successfully created reservations enter this lifecycle.</text></g><g class="entity" data-entity="GMN5" data-source-line="51" data-uid="ent0006" id="entity_GMN5"><path d="M438.57,382.0024 L438.57,406.1352 A0,0 0 0 0 438.57,406.1352 L783.0309,406.1352 A0,0 0 0 0 783.0309,406.1352 L783.0309,400.0024 L847.27,394.0624 L783.0309,392.0024 L783.0309,392.0024 L773.0309,382.0024 L438.57,382.0024 A0,0 0 0 0 438.57,382.0024" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><path d="M773.0309,382.0024 L773.0309,392.0024 L783.0309,392.0024 L773.0309,382.0024" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="323.4609" x="444.57" y="398.604">Cancelling checkout does not restart stopped charging.</text></g><g class="entity" data-entity="GMN8" data-source-line="54" data-uid="ent0009" id="entity_GMN8"><path d="M2090.6,177.4724 L2090.6,192.6024 L2025.94,196.6024 L2090.6,200.6024 L2090.6,215.738 A0,0 0 0 0 2090.6,215.738 L2419.0121,215.738 A0,0 0 0 0 2419.0121,215.738 L2419.0121,187.4724 L2409.0121,177.4724 L2090.6,177.4724 A0,0 0 0 0 2090.6,177.4724" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><path d="M2409.0121,177.4724 L2409.0121,187.4724 L2419.0121,187.4724 L2409.0121,177.4724" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.0605" x="2096.6" y="194.074">expiresAt = min(arrival + grace, departure).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="307.4121" x="2096.6" y="208.2068">Default grace: 15 minutes; snapshot per reservation.</text></g><g class="entity" data-entity="GMN11" data-source-line="58" data-uid="ent0012" id="entity_GMN11"><path d="M1221.16,579.4624 L1221.16,587.5324 L1156.3,591.5324 L1221.16,595.5324 L1221.16,603.5952 A0,0 0 0 0 1221.16,603.5952 L1538.4452,603.5952 A0,0 0 0 0 1538.4452,603.5952 L1538.4452,589.4624 L1528.4452,579.4624 L1221.16,579.4624 A0,0 0 0 0 1221.16,579.4624" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><path d="M1528.4452,579.4624 L1528.4452,589.4624 L1538.4452,589.4624 L1528.4452,579.4624" fill="#FFFBEB" style="stroke:#BBA86A;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="296.2852" x="1227.16" y="596.064">Early checkout also releases unused reserved time.</text></g><!--link *start* to Confirmed--><g class="link" data-entity-1="*start*" data-entity-2="Confirmed" data-source-line="40" data-uid="lnk3" id="link_*start*_Confirmed"><path d="M763.81,72.9524 C756.68,85.7524 745.7,110.7724 757.8,126.8724 C773.35,147.5324 820.9422,162.6537 873.2622,174.2537" fill="none" id="*start*-to-Confirmed" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="879.12,175.5524,871.1992,169.6991,874.2385,174.4701,869.4675,177.5095,879.12,175.5524" style="stroke:#42566B;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="414.1523" x="758.8" y="123.474">/ create reservation, snapshot expiresAt and allocate ALL covered slots</text></g><!--link Confirmed to CheckedIn--><g class="link" data-entity-1="Confirmed" data-entity-2="CheckedIn" data-source-line="45" data-uid="lnk4" id="link_Confirmed_CheckedIn"><path d="M995.8,231.6524 C995.8,267.4124 995.8,317.3324 995.8,353.0824" fill="none" id="Confirmed-to-CheckedIn" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="995.8,359.0824,999.8,350.0824,995.8,354.0824,991.8,350.0824,995.8,359.0824" style="stroke:#42566B;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.668" x="1119.2023" y="278.934">checkInConfirmed (UC-P06)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.8965" x="1071.0881" y="293.0668">[authorized owner &amp;&amp; matching Hub/vehicle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="366.9668" x="1017.0529" y="307.1996">&amp;&amp; arrival &lt;= now &lt; expiresAt &amp;&amp; allocation can be honoured]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="407.4727" x="996.8" y="321.3324">/ create one Active session; account occupancy against existing holds</text></g><!--reverse link Cancelled to Confirmed--><g class="link" data-entity-1="Cancelled" data-entity-2="Confirmed" data-source-line="46" data-uid="lnk6" id="link_Cancelled_Confirmed"><path d="M374.88,196.6024 C530.85,196.6024 745.36,196.6024 879.01,196.6024" fill="none" id="Cancelled-backto-Confirmed" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="368.88,196.6024,377.88,200.6024,373.88,196.6024,377.88,192.6024,368.88,196.6024" style="stroke:#42566B;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.7168" x="530.6296" y="148.204">cancellationConfirmed (UC-P04)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.7891" x="494.0935" y="162.3368">[authorized owner &amp;&amp; cancellation permitted</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="430.5879" x="409.1941" y="176.4696">&amp;&amp; now &lt; expiresAt &amp;&amp; dependents cancellable &amp;&amp; summary still current]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="444.9961" x="401.99" y="190.6024">/ cancel reservation and Pending/Scheduled dependents; release holds once</text></g><!--link Confirmed to Expired--><g class="link" data-entity-1="Confirmed" data-entity-2="Expired" data-source-line="47" data-uid="lnk7" id="link_Confirmed_Expired"><path d="M1112.69,196.6024 C1243.27,196.6024 1451.1,196.6024 1609.67,196.6024" fill="none" id="Confirmed-to-Expired" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="1615.67,196.6024,1606.67,192.6024,1610.67,196.6024,1606.67,200.6024,1615.67,196.6024" style="stroke:#42566B;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.8496" x="1295.1468" y="162.204">expiryCheck (FR-NI-13)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="345.0352" x="1192.054" y="176.3368">[now &gt;= expiresAt &amp;&amp; no Active parking/charging session]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="437.7832" x="1145.68" y="190.4696">/ expire as NoShow; cancel unused charging; release remaining holds once</text></g><!--link CheckedIn to Completed--><g class="link" data-entity-1="CheckedIn" data-entity-2="Completed" data-source-line="49" data-uid="lnk8" id="link_CheckedIn_Completed"><path d="M995.8,429.1124 C995.8,464.8824 995.8,514.8024 995.8,550.5424" fill="none" id="CheckedIn-to-Completed" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="995.8,556.5424,999.8,547.5424,995.8,551.5424,991.8,547.5424,995.8,556.5424" style="stroke:#42566B;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.1836" x="1119.7063" y="476.404">departureConfirmed (UC-P07)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.9512" x="1083.3225" y="490.5368">[authorized owner &amp;&amp; latest states verified</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.8828" x="1066.3566" y="504.6696">&amp;&amp; no Active charging &amp;&amp; summary still current]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="420.9961" x="996.8" y="518.8024">/ close visit; cancel unused requests; release remaining allocations once</text></g><!--link Cancelled to *end*--><g class="link" data-entity-1="Cancelled" data-entity-2="*end*" data-source-line="61" data-uid="lnk10" id="link_Cancelled_*end*"><path d="M213.58,231.8024 C251.51,280.3724 326.49,369.9724 405.8,428.8024 C615.04,583.9924 918.8223,683.3055 979.5323,702.2455" fill="none" id="Cancelled-to-*end*" style="stroke:#42566B;stroke-width:1;"/><polygon fill="#42566B" points="985.26,704.0324,977.8597,697.5336,980.4869,702.5433,975.4771,705.1705,985.26,704.0324" style="stroke:#42566B;stroke-width:1;"/></g><!--link Completed to *end*--><g class="link" data-entity-1="Completed" data-entity-2="*end*" data-source-line="62" data-uid="lnk11" id="link_Completed_*end*"><path d