.195" width="329.367" height="68.891" fill="#E8F1FA" style="stroke:#42566B;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="861.8" y1="578.492" x2="1191.167" y2="578.492" style="stroke:#42566B;stroke-width:0.5;"/><text x="988.305" y="570.19" fill="#172B4D" font-size="14" textLength="76.357">Completed</text><text x="866.8" y="596.487" fill="#172B4D" font-size="14" textLength="226.98">Linked parking session is Closed</text><text x="866.8" y="612.784" fill="#172B4D" font-size="14" textLength="309.367">Actual departure recorded without rounding</text></g><g class="entity" data-qualified-name="Cancelled" id="ent0004" data-source-line="33"><rect x="7" y="160.415" width="374.977" height="68.891" fill="#E8F1FA" style="stroke:#42566B;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="186.712" x2="381.977" y2="186.712" style="stroke:#42566B;stroke-width:0.5;"/><text x="160.08" y="178.41" fill="#172B4D" font-size="14" textLength="68.817">Cancelled</text><text x="12" y="204.707" fill="#172B4D" font-size="14" textLength="354.977">Parking and eligible dependent requests cancelled</text><text x="12" y="221.004" fill="#172B4D" font-size="14" textLength="257.626">Remaining allocations released once</text></g><g class="entity" data-qualified-name="Expired" id="ent0005" data-source-line="36"><rect x="1665.13" y="160.415" width="424.708" height="68.891" fill="#E8F1FA" style="stroke:#42566B;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1665.13" y1="186.712" x2="2089.838" y2="186.712" style="stroke:#42566B;stroke-width:0.5;"/><text x="1850.902" y="178.41" fill="#172B4D" font-size="14" textLength="53.163">Expired</text><text x="1670.13" y="204.707" fill="#172B4D" font-size="14" textLength="311.493">No-show; check-in and cancellation disabled</text><text x="1670.13" y="221.004" fill="#172B4D" font-size="14" textLength="404.708">Unused charging requests cancelled; holds released once</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="40