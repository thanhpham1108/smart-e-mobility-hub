85 L2495.664,185.885 L2485.664,175.885" style="stroke:#BBA86A;stroke-width:0.5;" fill="#FFFBEB"/><text x="2161.31" y="192.024" fill="#000" font-size="12" textLength="267.48">expiresAt = min(arrival + grace, departure).</text><text x="2161.31" y="205.993" fill="#000" font-size="12" textLength="319.354">Default grace: 15 minutes; snapshot per reservation.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="58"><path d="M1255.73,574.655 L1255.73,582.635 L1191.59,586.635 L1255.73,590.635 L1255.73,598.624 A0,0 0 0 0 1255.73,598.624 L1587.242,598.624 A0,0 0 0 0 1587.242,598.624 L1587.242,584.655 L1577.242,574.655 L1255.73,574.655 A0,0 0 0 0 1255.73,574.655" style="stroke:#BBA86A;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1577.242,574.655 L1577.242,584.655 L1587.242,584.655 L1577.242,574.655" style="stroke:#BBA86A;stroke-width:0.5;" fill="#FFFBEB"/><text x="1261.73" y="590.794" fill="#000" font-size="12" textLength="310.512">Early checkout also releases unused reserved time.</text></g><!--link *start* to Confirmed--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="40" data-link-type="dependency"><path d="M787.53,72.445 C780.44,85.035 769.52,109.645 781.49,125.415 C797.37,146.345 846.541,161.559 899.851,172.969" style="stroke:#42566B;stroke-width:1;" fill="none" id="*start*-to-Confirmed"/><polygon points="904.74,174.015,896.776,168.22,899.851,172.969,895.102,176.043,904.74,174.015" fill="#42566B" style="stroke:#42566B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="782.49" y="122.554" fill="#000" font-size="12" textLength="428.32">/ create reservation, snapshot expiresAt and allocate ALL covered slots</text></g><!--link Confirmed to CheckedIn--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="45" data-link-type="dependency"><path d="M1026.49,229.635 C1026.49,265.115 1026.49,315.585 1026.49,351.035" style="stroke:#42566B;stroke-widt